<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alunos – Bibliotech</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
</head>
<body data-pagina="alunos">
  <div class="app">
    <main class="conteudo" id="conteudo">
      <div class="conteudo__cabecalho">
        <div>
          <h1>Alunos</h1>
          <p>Cadastre e consulte os alunos que podem pegar livros emprestados.</p>
        </div>
        <span class="selo selo--aviso" id="contador" aria-live="polite"></span>
      </div>

      <div class="grade-2">
        <section class="cartao" aria-labelledby="titulo-form">
          <div class="cartao__titulo"><h2 id="titulo-form">Novo aluno</h2></div>
          <div class="alerta-form" id="alerta-form" role="alert" hidden></div>
          <form id="form-cadastro" novalidate>
            <input type="hidden" name="id">
            <div class="grade-form">
              <div class="campo campo--largo">
                <label for="nome">Nome completo *</label>
                <input type="text" id="nome" name="nome" autocomplete="off" maxlength="120" aria-describedby="erro-nome">
                <span class="campo__erro" id="erro-nome"></span>
              </div>
              <div class="campo">
                <label for="matricula">Matrícula *</label>
                <input type="text" id="matricula" name="matricula" maxlength="30" aria-describedby="erro-matricula">
                <span class="campo__erro" id="erro-matricula"></span>
              </div>
              <div class="campo">
                <label for="serie">Série / turma</label>
                <input type="text" id="serie" name="serie" maxlength="30" placeholder="Ex.: 2º ano A" aria-describedby="erro-serie">
                <span class="campo__erro" id="erro-serie"></span>
              </div>
              <div class="campo campo--largo">
                <label for="contato">Contato</label>
                <input type="text" id="contato" name="contato" maxlength="120" aria-describedby="erro-contato dica-contato">
                <span class="dica" id="dica-contato">E-mail ou telefone (opcional).</span>
                <span class="campo__erro" id="erro-contato"></span>
              </div>
            </div>
            <div class="acoes-form">
              <button type="submit" class="btn" id="btn-salvar">Cadastrar</button>
              <button type="button" class="btn btn--secundario" id="btn-cancelar" hidden>Cancelar edição</button>
            </div>
          </form>
        </section>

        <section class="cartao" aria-labelledby="titulo-lista">
          <div class="cartao__titulo"><h2 id="titulo-lista">Alunos cadastrados</h2></div>
          <div class="barra-busca">
            <label class="sr-only" for="busca">Buscar</label>
            <input type="search" id="busca" placeholder="Buscar por nome, matrícula ou série…">
          </div>
          <div class="tabela-wrap">
            <table id="tabela">
              <thead><tr><th>Nome</th><th>Matrícula</th><th>Série</th><th>Contato</th><th><span class="sr-only">Ações</span></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/dados.js"></script>
  <script src="js/validacao.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/alunos.js"></script>
</body>
</html>
