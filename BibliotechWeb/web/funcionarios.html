<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funcionários – Bibliotech</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="layout">
  <aside id="menu"></aside>
  <main class="conteudo" id="principal">
    <header class="cabecalho-pagina">
      <div><h1>Funcionários</h1><p>Equipe que registra empréstimos e devoluções.</p></div>
      <button class="botao" type="button" id="btn-novo">+ Novo funcionário</button>
    </header>
    <section class="cartao" aria-label="Lista de funcionários">
      <div class="barra-ferramentas">
        <label class="sr-only" for="busca">Buscar</label>
        <input type="search" id="busca" placeholder="Buscar..." autocomplete="off">
        <span id="contador" aria-live="polite"></span>
      </div>
      <div class="tabela-rolavel">
        <table>
          <thead><tr><th scope="col">Nome</th><th scope="col">Cargo</th><th scope="col">E-mail</th><th scope="col">Ações</th></tr></thead>
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<dialog id="dialogo-form" aria-labelledby="titulo-dialogo">
  <h2 id="titulo-dialogo"></h2>
  <form id="form-cadastro" novalidate>
    <div class="campo">
      <label for="nome">Nome completo</label>
      <input id="nome" name="nome" type="text" >
      <span class="erro" role="alert"></span>
    </div>
    <div class="campo">
      <label for="cargo">Cargo</label>
      <input id="cargo" name="cargo" type="text" >
      <span class="erro" role="alert"></span>
    </div>
    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" >
      <span class="erro" role="alert"></span>
    </div>
    <div class="acoes-form">
      <button type="button" class="botao secundario" id="btn-cancelar">Cancelar</button>
      <button type="submit" class="botao">Salvar</button>
    </div>
  </form>
</dialog>

<script src="js/dados.js"></script>
<script src="js/validacao.js"></script>
<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script src="js/funcionarios.js"></script>
</body>
</html>
